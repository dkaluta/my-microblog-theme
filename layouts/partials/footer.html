<footer class="site-footer">

  <div class="wrapper">
    {{ if templates.Exists "partials/microhook-footer.html" }}
    {{ partial "microhook-footer.html" . }}
    {{ else }}
    <p class="custom_footer">{{ partial "custom_footer.html" . }}</p>
    {{ end }}
    <p class="attribution custom_footer">{{ T "Hosted by" }} <a href="https://micro.blog">Micro.blog</a>. {{ T "Theme" }}: <a href="https://github.com/dkaluta/my-microblog-theme">dksh</a> — {{ T "based on" }} <a href="https://sumo.micro.blog">Sumo Theme</a> {{ T "by" }} <a href="https://www.mattlangford.com">Matt Langford</a>.</p>
  </div>

</footer>
